services:
  - type: web
    name: menil-app-backend
    env: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: menil-data
      mountPath: /app/data
      sizeGB: 1
